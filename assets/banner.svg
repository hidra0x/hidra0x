<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="hidra0x — iOS kernel research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="0.52" stop-color="#08101d"/>
      <stop offset="1" stop-color="#140811"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.84" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ff7a18" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.86" r="0.6">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="0.5" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffd7a8"/>
      <stop offset="1" stop-color="#7cc4ff"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <style>
      @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
      @keyframes dash { to { stroke-dashoffset:-220 } }
      @keyframes blink { 0%,45% { opacity:1 } 50%,100% { opacity:0 } }
      @keyframes scan { 0% { transform:translateY(0) } 100% { transform:translateY(420px) } }
      .pulse { animation:pulse 2.4s ease-in-out infinite }
      .dash { stroke-dasharray:8 10; animation:dash 7s linear infinite }
      .cursor { animation:blink 1.1s step-end infinite }
      .scan { animation:scan 6s linear infinite }
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glowRed)"/>
  <rect width="1280" height="420" fill="url(#glowBlue)"/>

  <g stroke="#162336" stroke-opacity="0.6" stroke-width="1">
    <path d="M0 84 H1280 M0 168 H1280 M0 252 H1280 M0 336 H1280"/>
    <path d="M96 0 V420 M192 0 V420 M288 0 V420 M384 0 V420 M480 0 V420 M576 0 V420 M672 0 V420 M768 0 V420 M864 0 V420 M960 0 V420 M1056 0 V420 M1152 0 V420"/>
  </g>

  <rect class="scan" x="0" y="-20" width="1280" height="2" fill="#58a6ff" opacity="0.16"/>

  <!-- hydra / hexagon -->
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path class="dash" d="M1000 232 C946 232 936 188 890 188 C844 188 838 146 802 146"/>
    <path class="dash" d="M1000 232 C974 196 996 158 1034 146 C1072 134 1078 100 1114 94"/>
    <path class="dash" d="M1000 232 C1036 238 1054 262 1090 262 C1126 262 1132 290 1168 296"/>
    <path class="dash" d="M1000 232 C964 254 958 284 922 290"/>
    <path class="dash" d="M1000 232 C1000 194 970 182 964 148"/>
  </g>
  <g fill="#070b12" stroke="url(#line)" stroke-width="3">
    <circle cx="1000" cy="232" r="22"/>
    <circle cx="802" cy="146" r="9"/>
    <circle cx="1114" cy="94" r="9"/>
    <circle cx="1168" cy="296" r="9"/>
    <circle cx="922" cy="290" r="9"/>
    <circle cx="964" cy="148" r="9"/>
  </g>
  <circle cx="1000" cy="232" r="48" fill="#ff3b5c" opacity="0.22" filter="url(#blur)"/>
  <circle class="pulse" cx="1000" cy="232" r="12" fill="#ffd7a8"/>

  <!-- terminal prompt -->
  <text x="80" y="104" fill="#5f7186" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="17">hidra0x@a12:~$</text>
  <text x="80" y="205" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="96" font-weight="800" letter-spacing="2">
    <tspan fill="url(#word)">hidra</tspan><tspan fill="#ff9f43">0x</tspan>
  </text>
  <text x="84" y="252" fill="#ffb86b" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3">iOS KERNEL RESEARCH · A12 / 18.7.2</text>
  <text x="84" y="288" fill="#8fa3b8" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="16">crash <tspan fill="#ff4d4d">→</tspan> control <tspan fill="#ff9f43">→</tspan> jailbreak</text>
  <rect class="cursor" x="404" y="276" width="11" height="18" fill="#27c93f"/>

  <!-- chips -->
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
    <rect x="84" y="322" width="176" height="30" rx="15" fill="#1a0d10" stroke="#ff4d4d" stroke-opacity="0.7"/>
    <text x="172" y="342" fill="#ff8a8a" text-anchor="middle">CVE-2026-20687</text>
    <rect x="272" y="322" width="112" height="30" rx="15" fill="#1a140b" stroke="#ff9f43" stroke-opacity="0.7"/>
    <text x="328" y="342" fill="#ffc078" text-anchor="middle">MOON</text>
    <rect x="396" y="322" width="128" height="30" rx="15" fill="#0b1219" stroke="#58a6ff" stroke-opacity="0.7"/>
    <text x="460" y="342" fill="#8fc7ff" text-anchor="middle">HIDRA</text>
    <rect x="536" y="322" width="156" height="30" rx="15" fill="#0b1219" stroke="#27c93f" stroke-opacity="0.6"/>
    <text x="614" y="342" fill="#8ff0a4" text-anchor="middle">AURORA TV</text>
  </g>

  <rect x="84" y="378" width="520" height="2" fill="url(#line)" opacity="0.9"/>
  <text x="84" y="404" fill="#c9d6e4" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">DATA-ONLY KERNEL CONTROL · NO PUBLIC BUILD YET</text>
  <text x="1196" y="404" fill="#5f7186" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">owned devices only</text>
</svg>
